<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#070b12" />
    <title>Pagina non trovata | RouteBudget EU</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #070b12; color: #f7f9fc; }
      main { width: min(100%, 760px); padding: clamp(32px, 7vw, 72px); border: 1px solid #293445; border-radius: 28px; background: #0d131e; }
      p { max-width: 58ch; color: #aeb9c8; line-height: 1.7; }
      .code { color: #80baff; font: 700 0.78rem/1 ui-monospace, monospace; letter-spacing: .14em; }
      h1 { max-width: 12ch; margin: 20px 0; font-size: clamp(2.5rem, 8vw, 5rem); line-height: .96; letter-spacing: -.05em; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      a { min-height: 46px; display: inline-flex; align-items: center; padding: 0 18px; border: 1px solid #40516a; border-radius: 999px; color: inherit; font-weight: 700; text-decoration: none; }
      a:first-child { border-color: #68a8ff; background: #68a8ff; color: #07101d; }
      a:focus-visible { outline: 3px solid #b9d7ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERRORE 404</p>
      <h1>Questa tratta non esiste.</h1>
      <p>Il collegamento può essere incompleto oppure la risorsa è stata spostata. Torna a RouteBudget o continua dalle guide e dai calcolatori pubblici.</p>
      <nav aria-label="Destinazioni disponibili">
        <a href="/">Pagina principale</a>
        <a href="/it/guide/">Guide</a>
        <a href="/it/calcolatori/">Calcolatori</a>
      </nav>
    </main>
  </body>
</html>
